<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Max und Mini: Nachbarzahlen</title>
<style>
:root{--ink:#1d3557;--sun:#ffc933;--dog:#e8903a;--frog:#43a047;--ok:#2e7d32;--okbg:#d6f0d0;--bad:#c62828;--badbg:#fbe0dc;--z:#e8760c;--zb:#fde3c7;--h:#1b3a8c;--hb:#d5def7;color-scheme:light}
*{box-sizing:border-box}
html{font-size:16px}
html,body{height:100%}
body{margin:0;background:linear-gradient(160deg,#cfeaff 0%,#e9f6ff 40%,#eef9e2 100%) fixed;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;color:var(--ink);font-family:"Avenir Next","Trebuchet MS",ui-rounded,system-ui,sans-serif;font-size:1.3rem;line-height:1.45;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-text-size-adjust:100%;touch-action:manipulation}
main{max-width:75rem;width:100%;margin:0 auto;padding:.7rem 1.3rem .8rem;flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto}
#play:not([hidden]){display:flex;flex-direction:column;flex:1;min-height:0}
.playing header{padding:.3rem 1rem;margin-bottom:.5rem;border-radius:1.2rem}
.playing header p{display:none}
.playing h1{font-size:1.5rem}
.playing .bd{width:2.8rem;height:2.8rem}
#play .tools{margin-bottom:.3rem}
#play .leg{margin:0;flex-wrap:nowrap}
#play .leg .chip{font-size:.8rem;padding:.15rem .5rem}
#play .tools{gap:.4rem;flex-wrap:nowrap;align-items:center}
#play .tools .btn,#play .tools .sw{font-size:.95rem;padding:.3rem .7rem;min-height:2.6rem;white-space:nowrap}
#play .tools .leaves{display:none}
#play .leg .chip{font-size:.72rem}
#play .task{font-size:1.35rem;margin:.1rem 0 .4rem}
#play .say{margin:.2rem 0 .5rem}
#play .pf{width:3.6rem}#play .pf svg{width:3.6rem}
#play .fb{min-height:3rem;padding:.4rem 1rem;font-size:1.2rem}
#play .row{margin-bottom:0}
#play .btn{min-height:3.2rem}
#play .ans{margin-bottom:.5rem}
#end{overflow:auto}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;gap:1.2rem;margin-bottom:1.1rem;background:rgba(255,255,255,.75);-webkit-backdrop-filter:blur(.4rem);backdrop-filter:blur(.4rem);border-radius:1.8rem;padding:.8rem 1.4rem;box-shadow:0 .5rem 1.6rem rgba(29,53,87,.14)}
.badges{display:flex;flex:none}
.bd{width:4.8rem;height:4.8rem;border-radius:50%;display:grid;place-items:center;border:4px solid #fff;box-shadow:0 .15rem 0 rgba(29,53,87,.25)}
.bd svg{width:84%;height:84%}
.bd.d{background:var(--dog)}.bd.f{background:var(--frog);margin-left:-.9rem}
h1{font-size:2.2rem;line-height:1.1;margin:0;letter-spacing:-.02em}
header p{margin:.15rem 0 0;font-size:1.15rem}
.btn{min-height:3.5rem;padding:.5rem 1.5rem;border-radius:1.3rem;border:2px solid var(--ink);background:#fff;font-weight:700;box-shadow:0 .25rem 0 rgba(29,53,87,.22);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(.18rem);box-shadow:0 .07rem 0 rgba(29,53,87,.22)}
.btn.pri{background:linear-gradient(180deg,#2a4a78,#1d3557);color:#fff}
.btn:disabled{opacity:.5}
.btn:focus-visible,input:focus-visible,.mode:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.row{display:flex;gap:.9rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.lead{font-weight:700;margin:.5rem 0 .4rem}
.leg{display:flex;gap:.6rem;flex-wrap:wrap;margin:.2rem 0 .8rem}
.chip{display:inline-block;padding:.1rem .9rem;border-radius:1rem;border:2px solid;font-weight:700;font-size:1.05rem}
.chip.z{border-color:var(--z);background:var(--zb)}.chip.h{border-color:var(--h);background:var(--hb)}
.seg{display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:.6rem}
.seg button{padding:.6rem 1.2rem;border-radius:1.2rem;border:2px solid var(--ink);background:#fff;font-weight:700;text-align:left;box-shadow:0 .2rem 0 rgba(29,53,87,.2)}
.seg button small{display:block;font-weight:400;font-size:1rem}
.seg button[aria-pressed=true]{background:var(--sun);box-shadow:0 0 0 .22rem rgba(255,201,51,.45),0 .2rem 0 rgba(29,53,87,.2)}
.sw{display:inline-flex;align-items:center;gap:.7rem;font-weight:700;background:#fff;padding:.5rem 1.1rem;border-radius:1.2rem;border:2px solid var(--ink)}
.sw input{width:1.7rem;height:1.7rem;accent-color:var(--frog)}
.modes{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(22rem,1fr));margin:.6rem 0}
.mode{text-align:left;padding:1.1rem 1.3rem;border-radius:1.7rem;border:0;background:#fff;display:flex;gap:1rem;align-items:center;box-shadow:0 .5rem 1.3rem rgba(29,53,87,.16);transition:transform .12s}
.mode:active{transform:scale(.985)}
.mode i{font-style:normal;font-size:2.3rem;flex:none;width:4.4rem;height:4.4rem;border-radius:1.3rem;display:grid;place-items:center;background:#fde9d0}
.mode:nth-child(even) i{background:#dbf3d8}
.mode b{display:block;font-size:1.6rem;line-height:1.2}
.mode span{font-size:1.1rem;display:block}
.tools{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap;margin-bottom:.5rem}
.leaves{display:flex;gap:.5rem;flex-wrap:wrap}
.leaf{width:1.5rem;height:1.5rem;border-radius:0 100% 0 100%;border:3px solid var(--frog);background:#fff;box-shadow:0 .1rem .3rem rgba(0,0,0,.12)}
.leaf.now{background:var(--sun);border-color:var(--ink)}
.leaf.done{background:#b9c6d6;border-color:var(--ink)}
.leaf.star{background:var(--frog)}
.task{font-size:1.5rem;margin:.3rem 0 .6rem}
.card{position:relative;flex:1 1 0;min-height:7rem;background:#fff;border-radius:1.6rem;margin-bottom:.6rem;box-shadow:0 .4rem 1.1rem rgba(29,53,87,.13)}
.card svg{position:absolute;left:.6rem;top:.4rem;width:calc(100% - 1.2rem);height:calc(100% - .8rem);display:block}
.ans{display:flex;gap:1rem;align-items:flex-end;justify-content:center;flex-wrap:wrap;margin-bottom:1rem}
.ans .col{display:flex;flex-direction:column;gap:.3rem;align-items:center}
.ans label{font-weight:800;font-size:1.1rem;padding:.05rem .8rem;border-radius:1rem;border:2px solid}
.ans label.z,.hd.z{border-color:var(--z);background:var(--zb)}.ans label.h,.hd.h{border-color:var(--h);background:var(--hb)}
.ans .mid{font-size:1.9rem;font-weight:800;padding:.4rem 1.2rem;border-radius:1.2rem;background:#fff;border:3px solid var(--ink);display:flex;gap:.6rem;align-items:center}
.ans .mid svg{width:2.8rem}
.lt{font-size:2rem;font-weight:800}
.num{font:inherit;font-size:1.8rem;width:11.5rem;height:3.6rem;padding:0 .8rem;border:3px solid var(--ink);border-radius:1rem;background:#fff;color:var(--ink);text-align:center}
.num.z{border-color:var(--z)}.num.h{border-color:var(--h)}
.num.c0{border-color:#6a4fd1}.num.c1{border-color:#1b3a8c}.num.c2{border-color:#e8760c}.num.c3{border-color:#2e7d32}
.num.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:800}
.num.bad{background:var(--badbg);border-color:var(--bad)}
.tb{display:grid;gap:.55rem;align-items:center;margin-bottom:.9rem}
.tb .hd{font-weight:800;text-align:center;padding:.1rem .4rem;border-radius:.9rem;border:2px solid var(--ink);background:#fff;line-height:1.2}
.tb .hd small{display:block;font-weight:400;font-size:.95rem}
.tb .rn{width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;justify-self:center}
.tb .zahl{font-size:1.6rem;font-weight:800;text-align:center;background:#fff;border:3px solid var(--ink);border-radius:1rem;padding:.35rem .4rem}
.tb .num{width:100%;font-size:1.5rem;height:3.2rem}
.tb .ty{padding:.1rem .4rem;border:2px solid;border-radius:.9rem;text-align:center;line-height:1.1;font-weight:800;font-size:1.15rem}
.tb .ty small{display:block;font-weight:600;font-size:.78rem}
.tb .ty.c0{border-color:#6a4fd1;background:#e6e0fa}.tb .ty.c1{border-color:#1b3a8c;background:#d5def7}.tb .ty.c2{border-color:#e8760c;background:#fde3c7}.tb .ty.c3{border-color:#2e7d32;background:#d6f0d0}
.tb .rn.sel,.tb .zahl.sel{box-shadow:0 0 0 .25rem var(--sun)}
.tb [data-r]{cursor:pointer}
.tb.rep{gap:.35rem .5rem}
.tb.rep .rn{width:2.2rem;height:2.2rem;background:var(--ink)}
.tb.rep .num{height:2.6rem;font-size:1.3rem}
.tb.rep .zahl{font-size:1.35rem;padding:.2rem .3rem}
.tb.rep .hd{font-size:1rem;padding:0 .4rem}
.say{display:flex;gap:.9rem;align-items:center;margin:.3rem 0 1rem}
.pf{flex:none;width:4.8rem}
.pf svg{width:4.8rem;display:block}
.fb{flex:1;position:relative;min-height:4.2rem;padding:.7rem 1.1rem;border-radius:1.4rem;border:2px solid var(--ink);background:#fff;font-size:1.3rem;box-shadow:0 .3rem .9rem rgba(29,53,87,.12)}
.fb::before{content:"";position:absolute;left:-.9rem;top:50%;margin-top:-.6rem;width:1.1rem;height:1.1rem;background:inherit;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.fb.good{background:var(--okbg);border-color:var(--ok)}.fb.nope{background:var(--badbg);border-color:var(--bad)}
.fb.good::before{border-color:var(--ok)}.fb.nope::before{border-color:var(--bad)}
@keyframes sh{20%{transform:translateX(-.5rem)}60%{transform:translateX(.5rem)}}
.shake{animation:sh .35s}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
#end{text-align:center;padding-top:.6rem}
#end .badges{justify-content:center;margin-bottom:.6rem}
.big{font-size:4.4rem;line-height:1;color:var(--sun);margin:.6rem 0;-webkit-text-stroke:2px var(--ink)}
@media (max-width:700px){h1{font-size:1.5rem}.bd{width:3.6rem;height:3.6rem}.num{width:9rem}}
.num.sm{width:9.5rem;font-size:1.4rem;height:3rem}
.dl{font-weight:700;font-size:1rem;color:#4a5d7a}
.jp{display:flex;align-items:center;gap:.4rem;font-size:1.8rem;font-weight:800;margin-bottom:.4rem}
.ans .col.d{gap:.15rem}
</style>
</head>
<body>
<main>
<header>
  <div class="badges"><span class="bd d" id="b1"></span><span class="bd f" id="b2"></span></div>
  <div><h1>Max und Mini: Nachbarzahlen</h1><p>Nachbarzahlen am Zahlenstrahl</p></div>
</header>

<section id="menu">
  <div class="leg"><span class="chip z">NZT = Nachbarzehntausender</span><span class="chip h">NHT = Nachbarhunderttausender</span></div>
  <p class="lead">Was soll geübt werden?</p>
  <div class="seg" id="segKind">
    <button data-k="Z" aria-pressed="true">Nachbarzehntausender<small>NZT</small></button>
    <button data-k="H" aria-pressed="false">Nachbarhunderttausender<small>NHT</small></button>
    <button data-k="M" aria-pressed="false">Gemischt<small>abwechselnd NZT und NHT</small></button>
  </div>
  <div class="row"><label class="sw"><input type="checkbox" id="ex1" checked> Erklärmodus</label></div>
  <p class="lead">Wähle ein Spiel:</p>
  <div class="modes">
    <button class="mode" data-g="one"><i>📏</i><div><b>Eine Zahl am Zahlenstrahl</b><span>Finde die beiden Nachbarn.</span></div></button>
    <button class="mode" data-g="tab"><i>📋</i><div><b>Tabelle mit mehreren Zahlen</b><span>Trage die Nachbarn in die Tabelle ein.</span></div></button>
    <button class="mode" data-g="rep"><i>🔁</i><div><b>Wiederholung</b><span>Alles gemischt: NT, NH, NZ, Vorgänger, Nachfolger.</span></div></button>
    <button class="mode" data-g="exp"><i>🏆</i><div><b>Experte</b><span>Nachbarn finden, vor und zurück rechnen.</span></div></button>
  </div>
</section>

<section id="play" hidden>
  <div class="tools">
    <button class="btn" id="back">‹ Einstellungen</button>
    <div class="leaves" id="dots" aria-hidden="true"></div>
    <div class="leg"><span class="chip z">NZT = Nachbarzehntausender</span><span class="chip h">NHT = Nachbarhunderttausender</span></div>
    <label class="sw"><input type="checkbox" id="ex2"> Erklärmodus</label><label class="sw"><input type="checkbox" id="di2"> Rechne vor und zurück</label>
  </div>
  <p class="task" id="q"></p>
  <div class="card" id="nl"></div>
  <div id="ans"></div>
  <div class="say"><div class="pf" id="pf" aria-hidden="true"></div><div class="fb" id="fb" role="status" aria-live="polite"></div></div>
  <div class="row">
    <button class="btn pri" id="chk" hidden>Prüfen</button>
    <button class="btn" id="tip" hidden>Tipp</button>
    <button class="btn" id="sol" hidden>Lösung zeigen</button>
    <button class="btn pri" id="nxt" hidden>Weiter ›</button>
  </div>
</section>

<section id="end" hidden>
  <div class="badges"><span class="bd d" id="b3"></span><span class="bd f" id="b4"></span></div>
  <h1>Max und Mini sind stolz auf euch!</h1>
  <div class="big" id="stars"></div>
  <p id="score"></p>
  <div class="row" style="justify-content:center"><button class="btn pri" id="again">Noch eine Runde</button><button class="btn" id="home">Einstellungen</button></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
/* Skalierung über die Grundschriftgröße (rem): iPad bleibt bei 100 %, große Bildschirme wachsen mit. Der Zahlenstrahl selbst ist eine SVG-Grafik und skaliert exakt mit. */
function fit(){const z=Math.max(1,Math.min(innerWidth/1200,innerHeight/850));document.documentElement.style.fontSize=(16*z)+"px"}
fit();addEventListener("resize",fit);addEventListener("orientationchange",fit);

const f=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,".");
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const one=a=>a[Math.floor(Math.random()*a.length)];
const parse=s=>{const d=String(s).replace(/\D/g,"");return d?+d:null};

/* ---------- Figuren (SVG, Position nur über Attribute) ---------- */
function shape(k){
  if(k==="dog")return '<ellipse cx="-25" cy="-4" rx="11" ry="20" fill="#8a5a2b" transform="rotate(14 -25 -4)"/><ellipse cx="25" cy="-4" rx="11" ry="20" fill="#8a5a2b" transform="rotate(-14 25 -4)"/><circle r="28" fill="#e8a45a"/><ellipse cy="10" rx="15" ry="11" fill="#fbe3c2"/><circle cx="-11" cy="-6" r="4.5" fill="#1d3557"/><circle cx="11" cy="-6" r="4.5" fill="#1d3557"/><circle cx="-9.6" cy="-7.4" r="1.5" fill="#fff"/><circle cx="12.4" cy="-7.4" r="1.5" fill="#fff"/><ellipse cy="5" rx="5.5" ry="3.8" fill="#1d3557"/><path d="M-8 14 Q0 22 8 14" fill="none" stroke="#1d3557" stroke-width="2.6" stroke-linecap="round"/><path d="M-3 18 Q0 27 3 18 Z" fill="#f06292"/>';
  return '<circle cx="-17" cy="-22" r="12" fill="#43a047"/><circle cx="17" cy="-22" r="12" fill="#43a047"/><ellipse rx="31" ry="25" fill="#4caf50"/><circle cx="-17" cy="-23" r="8" fill="#fff"/><circle cx="17" cy="-23" r="8" fill="#fff"/><circle cx="-16" cy="-22" r="4" fill="#1d3557"/><circle cx="18" cy="-22" r="4" fill="#1d3557"/><circle cx="-20" cy="8" r="5" fill="#f48fb1" opacity=".7"/><circle cx="20" cy="8" r="5" fill="#f48fb1" opacity=".7"/><path d="M-17 6 Q0 22 17 6" fill="none" stroke="#1d3557" stroke-width="3" stroke-linecap="round"/>';
}
const icon=k=>`<svg viewBox="-40 -42 80 80" aria-hidden="true">${shape(k)}</svg>`;
$("b1").innerHTML=$("b3").innerHTML=icon("dog");$("b2").innerHTML=$("b4").innerHTML=icon("frog");

/* ---------- Zahlen und Aufgaben ---------- */
let cfg={kind:"Z",explain:true,dist:false},st={};
const nb=n=>({h0:Math.floor(n/100000)*100000,h1:Math.floor(n/100000)*100000+100000,z0:Math.floor(n/10000)*10000,z1:Math.floor(n/10000)*10000+10000});
function numFor(lvl){ // Nachbarn und Zahl; Zahl liegt weit genug von beiden Nachbarn weg
  const st_=lvl==="Z"?10000:100000,lo=lvl==="Z"?rnd(10,99)*10000:rnd(1,9)*100000,r=rnd(st_/400,st_*3/400)*100;
  return {lo:lo,hi:lo+st_,n:lo+r};
}
const RT=[{k:"NT",u:1000,name:"Nachbartausender",c:0,col:"#6a4fd1"},{k:"NH",u:100,name:"Nachbarhunderter",c:1,col:"#1b3a8c"},{k:"NZ",u:10,name:"Nachbarzehner",c:2,col:"#e8760c"},{k:"V · N",u:1,name:"Vorgänger · Nachfolger",c:3,col:"#2e7d32",vn:true}];
const mag=()=>one([rnd(1,9),rnd(10,99),rnd(100,999)]);
function repRow(T){
  let n;
  if(T.u===1000)n=mag()*1000+rnd(25,75)*10;
  else if(T.u===100)n=mag()*1000+rnd(0,9)*100+rnd(25,75);
  else if(T.u===10)n=one([rnd(1,9),rnd(10,99),rnd(100,999),rnd(1000,9999)])*100+rnd(0,9)*10+rnd(3,7);
  else n=one([rnd(1,9),rnd(10,99),rnd(100,999),rnd(1000,9999),rnd(10000,99999)])*10+rnd(1,8);
  const u=T.u,a=Math.floor(n/(10*u))*10*u,lo=T.vn?n-1:Math.floor(n/u)*u;
  return {T:T,u:u,vn:!!T.vn,n:n,lo:lo,hi:T.vn?n+1:lo+u,a:a,b:a+10*u};
}
function newTask(){
  const pet=one([{k:"dog",n:"Max"},{k:"frog",n:"Mini"}]);
  if(st.game==="rep"){
    const ts=RT.slice();for(let i=ts.length-1;i>0;i--){const j=rnd(0,i);[ts[i],ts[j]]=[ts[j],ts[i]]}
    return {type:"rep",pet:pet,rows:ts.map(repRow)};
  }
  if(st.game!=="tab"){
    const lvl=cfg.kind==="M"?one(["Z","H"]):cfg.kind,x=numFor(lvl);
    const a=lvl==="Z"?Math.floor(x.lo/100000)*100000:0;
    return {type:"one",lvl:lvl,n:x.n,pet:pet,lo:x.lo,hi:x.hi,a:a,b:lvl==="Z"?a+100000:1000000};
  }
  const W0=rnd(1,7)*100000,nums=[];
  for(let i=0;i<3;i++){const n=W0+i*100000+rnd(1,8)*10000+rnd(12,88)*100;nums.push(Object.assign({n:n},nb(n)))}
  return {type:"tab",cols:cfg.kind,a:W0,b:W0+300000,nums:nums,pet:pet};
}

/* ---------- Zahlenstrahl zeichnen ---------- */
const COLZ="#e8760c",COLH="#1b3a8c",PCOL=["#e8903a","#43a047","#6a4fd1"];
function axis(Y){return `<line x1="24" y1="${Y}" x2="972" y2="${Y}" stroke="#1d3557" stroke-width="5" stroke-linecap="round"/><path d="M958 ${Y-13} L982 ${Y} L958 ${Y+13}" fill="none" stroke="#1d3557" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`}
function svgOne(t,ex){
  const a=t.a,b=t.b,step=t.lvl==="Z"?10000:100000,N=(b-a)/step,Y=170,X=v=>110+780*(v-a)/(b-a),col=t.lvl==="Z"?COLZ:COLH,tag=t.lvl==="Z"?"NZT":"NHT",xn=X(t.n),xl=X(t.lo),xh=X(t.hi);
  let s=`<svg viewBox="0 0 1000 330" role="img" aria-label="Zahlenstrahl"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5d6f8a"/></marker></defs><rect x="0" y="${Y+28}" width="1000" height="${330-Y-28}" rx="18" fill="#d9f0c7"/>`+axis(Y);
  if(ex)s+=`<line x1="${xl}" y1="${Y}" x2="${xh}" y2="${Y}" stroke="${col}" stroke-width="12" stroke-linecap="round" opacity=".55"/>`;
  for(let i=0;i<=N;i++){const h=i===0||i===N?34:i===N/2?26:16;
    s+=`<line class="tk" x1="${X(a+i*step)}" x2="${X(a+i*step)}" y1="${Y-h}" y2="${Y+h}" stroke="#1d3557" stroke-width="${h>20?6:4}" stroke-linecap="round"/>`}
  const lab=(v,y,c,tg)=>`<text x="${X(v)}" y="${y}" text-anchor="middle" font-size="23" font-weight="700" fill="${c}">${f(v)}</text>`+(tg?`<text x="${X(v)}" y="${y+25}" text-anchor="middle" font-size="20" font-weight="800" fill="${c}">${tg}</text>`:"");
  if(ex){
    s+=lab(t.lo,Y+58,col,tag)+`<line x1="${xh}" x2="${xh}" y1="${Y+18}" y2="${Y+94}" stroke="${col}" stroke-width="3" stroke-dasharray="5 5"/>`+lab(t.hi,Y+118,col,tag);
    [t.lo,t.hi].forEach(v=>{s+=`<circle cx="${X(v)}" cy="${Y}" r="12" fill="${col}" stroke="#fff" stroke-width="3"/>`});
  }else(t.lvl==="Z"?[a,b]:[0,500000,1000000]).forEach(v=>{s+=lab(v,Y+58,"#1d3557","")});
  if(st.dist){ // Sprünge zurück und vor, Zahlen stehen über den Nachbarn
    const jump=(to,txt,anchor,tx)=>`<path d="M${xn} ${Y-8} Q${(xn+to)/2} ${Y-95} ${to} ${Y-14}" fill="none" stroke="#5d6f8a" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ar)"/><text x="${tx}" y="${Y-62}" text-anchor="${anchor}" font-size="22" font-weight="800" fill="#1d3557">${txt}</text>`;
    s+=jump(xl,"− "+(ex?f(t.n-t.lo):"?"),"end",xl+10)+jump(xh,"+ "+(ex?f(t.hi-t.n):"?"),"start",xh-10);
  }
  s+=`<g id="pet"><line x1="${xn}" x2="${xn}" y1="82" y2="${Y-22}" stroke="#1d3557" stroke-width="3" stroke-dasharray="6 6" opacity=".6"/><g transform="translate(${xn} 52) scale(.8)">${shape(t.pet.k)}</g><circle cx="${xn}" cy="${Y}" r="9" fill="${t.pet.k==="dog"?"#e8903a":"#43a047"}" stroke="#fff" stroke-width="3"/><rect x="${xn-62}" y="0" width="124" height="28" rx="14" fill="#fff" stroke="#1d3557" stroke-width="2.5"/><text x="${xn}" y="21" text-anchor="middle" font-size="20" font-weight="800" fill="#1d3557">${f(t.n)}</text></g>`;
  return s+"</svg>";
}
function svgRep(r,pet,ex){
  const a=r.a,b=r.b,u=r.u,Y=170,X=v=>110+780*(v-a)/(b-a),col=r.T.col,xn=X(r.n),xl=X(r.lo),xh=X(r.hi),tl=r.vn?"V":r.T.k,th=r.vn?"N":r.T.k;
  let s=`<svg viewBox="0 0 1000 330" role="img" aria-label="Zahlenstrahl"><rect x="0" y="${Y+28}" width="1000" height="${330-Y-28}" rx="18" fill="#d9f0c7"/>`+axis(Y);
  if(ex)s+=`<line x1="${xl}" y1="${Y}" x2="${xh}" y2="${Y}" stroke="${col}" stroke-width="12" stroke-linecap="round" opacity=".55"/>`;
  for(let i=0;i<=10;i++){const h=i===0||i===10?34:i===5?26:16;
    s+=`<line class="tk" x1="${X(a+i*u)}" x2="${X(a+i*u)}" y1="${Y-h}" y2="${Y+h}" stroke="#1d3557" stroke-width="${h>20?6:4}" stroke-linecap="round"/>`}
  const lab=(v,y,c,tg)=>`<text x="${X(v)}" y="${y}" text-anchor="middle" font-size="23" font-weight="700" fill="${c}">${f(v)}</text>`+(tg?`<text x="${X(v)}" y="${y+25}" text-anchor="middle" font-size="20" font-weight="800" fill="${c}">${tg}</text>`:"");
  if(ex){
    s+=lab(r.lo,Y+58,col,tl)+`<line x1="${xh}" x2="${xh}" y1="${Y+18}" y2="${Y+94}" stroke="${col}" stroke-width="3" stroke-dasharray="5 5"/>`+lab(r.hi,Y+118,col,th);
    [r.lo,r.hi].forEach(v=>{s+=`<circle cx="${X(v)}" cy="${Y}" r="12" fill="${col}" stroke="#fff" stroke-width="3"/>`});
  }else[a,a+5*u,b].forEach(v=>{s+=lab(v,Y+58,"#1d3557","")});
  s+=`<g id="pet"><line x1="${xn}" x2="${xn}" y1="82" y2="${Y-22}" stroke="#1d3557" stroke-width="3" stroke-dasharray="6 6" opacity=".6"/><g transform="translate(${xn} 52) scale(.8)">${shape(pet.k)}</g><circle cx="${xn}" cy="${Y}" r="9" fill="${pet.k==="dog"?"#e8903a":"#43a047"}" stroke="#fff" stroke-width="3"/><rect x="${xn-62}" y="0" width="124" height="28" rx="14" fill="#fff" stroke="#1d3557" stroke-width="2.5"/><text x="${xn}" y="21" text-anchor="middle" font-size="20" font-weight="800" fill="#1d3557">${f(r.n)}</text></g>`;
  return s+"</svg>";
}
function svgTab(t,ex){
  const a=t.a,b=t.b,N=(b-a)/10000,Y=206,X=v=>90+820*(v-a)/(b-a);
  let s=`<svg viewBox="0 0 1000 300" role="img" aria-label="Zahlenstrahl"><rect x="0" y="236" width="1000" height="64" rx="18" fill="#d9f0c7"/>`+axis(Y);
  for(let i=0;i<=N;i++){const v=a+i*10000,maj=v%100000===0,mid=v%50000===0&&!maj,h=maj?30:mid?22:13;
    s+=`<line class="tk" x1="${X(v)}" x2="${X(v)}" y1="${Y-h}" y2="${Y+h}" stroke="#1d3557" stroke-width="${maj?6:4}" stroke-linecap="round"/>`;
    if(maj)s+=`<text x="${X(v)}" y="270" text-anchor="middle" font-size="21" font-weight="700" fill="#1d3557">${f(v)}</text>`}
  const order=t.nums.map((x,i)=>i).sort((p,q)=>t.nums[p].n-t.nums[q].n),rowY=[112,66,20],pos={};
  order.forEach((i,k)=>{pos[i]=rowY[k]});
  t.nums.forEach((x,i)=>{s+=`<line x1="${X(x.n)}" x2="${X(x.n)}" y1="${pos[i]+34}" y2="${Y+16}" stroke="${PCOL[i]}" stroke-width="3.5" stroke-dasharray="7 6"/>`});
  if(ex)t.nums.forEach(x=>{const m=[];if(t.cols!=="H")m.push([x.z0,COLZ],[x.z1,COLZ]);if(t.cols!=="Z")m.push([x.h0,COLH],[x.h1,COLH]);
    m.forEach(p=>{s+=`<circle cx="${X(p[0])}" cy="${Y}" r="${p[1]===COLH?14:10}" fill="${p[1]}" stroke="#fff" stroke-width="3"/>`})});
  t.nums.forEach((x,i)=>{s+=`<circle cx="${X(x.n)}" cy="${Y}" r="8" fill="${PCOL[i]}" stroke="#fff" stroke-width="3"/>`});
  t.nums.forEach((x,i)=>{const y=pos[i],fx=Math.min(Math.max(X(x.n)-84,6),1000-174);
    s+=`<rect x="${fx}" y="${y}" width="168" height="34" rx="17" fill="#fff" stroke="${PCOL[i]}" stroke-width="3"/><circle cx="${fx+19}" cy="${y+17}" r="13" fill="${PCOL[i]}"/><text x="${fx+19}" y="${y+24}" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">${i+1}</text><text x="${fx+40}" y="${y+25}" font-size="21" font-weight="800" fill="#1d3557">${f(x.n)}</text>`});
  return s+"</svg>";
}

/* ---------- Ablauf ---------- */
const N_ONE=8,N_TAB=3;
function leaves(){$("dots").innerHTML=st.ex?"":Array.from({length:st.n},(_,k)=>`<span class="leaf ${k<st.res.length?(st.res[k]?"star":"done"):k===st.i?"now":""}"></span>`).join("")}
function msg(t,k){$("fb").textContent=t;$("fb").className="fb "+(k||"")}
function shake(el){el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")}
function show(id){["menu","play","end"].forEach(s=>$(s).hidden=s!==id);document.body.classList.toggle("playing",id==="play");window.scrollTo(0,0)}
function start(g){st={game:g,i:0,n:g==="tab"||g==="rep"?N_TAB:N_ONE,res:[],stars:0,dist:g==="exp"||(g==="one"&&cfg.dist)};$("ex2").checked=cfg.explain;$("di2").checked=cfg.dist;$("ex2").parentNode.hidden=g==="exp";$("di2").parentNode.hidden=g!=="one";document.querySelector("#play .leg").hidden=g==="rep";show("play");load()}
const INP='type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocorrect="off" spellcheck="false"';
function load(){
  const t=st.t=newTask();st.ex=st.game==="exp"?false:cfg.explain;st.tries=0;st.done=false;
  ["chk","tip","sol","nxt"].forEach(b=>$(b).hidden=true);
  $("pf").innerHTML=icon(t.pet.k);
  st.sel=0;
  $("nl").innerHTML=t.type==="one"?svgOne(t,st.ex):t.type==="rep"?svgRep(t.rows[0],t.pet,st.ex):svgTab(t,st.ex);
  t.type==="one"?buildOne(t):t.type==="rep"?buildRep(t):buildTab(t);
  leaves();
  if(st.ex){
    $("q").innerHTML="So geht es:";
    msg(t.type==="one"?explainOne(t):t.type==="rep"?explainRep(t.rows[0]):"Die Punkte zeigen die Nachbarn: links und rechts von jeder Zahl.");
    $("nxt").hidden=false;$("nxt").textContent="Nächstes Beispiel ›";
  }else{
    $("q").innerHTML=`${t.type==="one"?taskOne(t):t.type==="rep"?"Trage die Nachbarn ein. Tippe eine Zeile an, dann siehst du die Zahl am Zahlenstrahl.":"Trage die Nachbarn in die Tabelle ein."}`;
    msg("Schau links und rechts von der Zahl.");
    $("chk").hidden=false;$("tip").hidden=false;$("nxt").textContent=st.i===st.n-1?"Fertig ›":"Weiter ›";
  }
}
const nm=l=>l==="Z"?["NZT","Nachbarzehntausender"]:["NHT","Nachbarhunderttausender"];
const taskOne=t=>`${t.pet.n} steht auf <b>${f(t.n)}</b>. Finde die beiden ${nm(t.lvl)[0]}${st.dist?" und rechne vor und zurück":""}.`;
const explainOne=t=>`${f(t.n)} liegt zwischen den Nachbarn ${f(t.lo)} und ${f(t.hi)}.`;
function buildOne(t){
  const [ab]=nm(t.lvl),c=t.lvl==="Z"?"z":"h",v=st.ex,d=st.dist;
  const inp=(id,val,cl,lab)=>`<input class="num ${cl}${v?" ok":""}" id="${id}" ${INP} aria-label="${lab}" ${v?`value="${f(val)}" readonly`:""}>`;
  const dist=(id,val,lab,sg)=>d?`<span class="dl">${lab}</span><div class="jp">${sg}${inp(id,val,"sm",lab)}</div>`:"";
  $("ans").innerHTML=`<div class="ans"><div class="col d">${dist("dlo",t.n-t.lo,"Rechne zurück","−")}<label class="${c}">${ab} davor</label>${inp("lo",t.lo,c,ab+" davor")}</div><div class="lt">&lt;</div><div class="mid">${icon(t.pet.k)}${f(t.n)}</div><div class="lt">&lt;</div><div class="col d">${dist("dhi",t.hi-t.n,"Rechne vor","+")}<label class="${c}">${ab} danach</label>${inp("hi",t.hi,c,ab+" danach")}</div></div>`;
}
const explainRep=r=>r.vn?`${f(r.n)}: Vorgänger ${f(r.lo)}, Nachfolger ${f(r.hi)}.`:`${f(r.n)} liegt zwischen den ${r.T.name}n ${f(r.lo)} und ${f(r.hi)}.`;
function buildRep(t){
  const v=st.ex;
  let h=`<div class="tb rep" style="grid-template-columns:2.2rem 11rem repeat(3,1fr)"><span></span><div class="hd">Aufgabe</div><div class="hd">davor</div><div class="hd">Zahl</div><div class="hd">danach</div>`;
  t.rows.forEach((r,i)=>{
    const inp=(k,val)=>`<input class="num c${r.T.c}${v?" ok":""}" id="t${i}${k}" data-r="${i}" ${INP} aria-label="${r.vn?(k==="lo"?"Vorgänger":"Nachfolger"):(k==="lo"?"kleinerer":"größerer")+" "+r.T.name}, Zeile ${i+1}" ${v?`value="${f(val)}" readonly`:""}>`;
    h+=`<div class="rn${i===st.sel?" sel":""}" data-r="${i}">${i+1}</div><div class="ty c${r.T.c}" data-r="${i}">${r.T.k}<small>${r.T.name}</small></div>${inp("lo",r.lo)}<div class="zahl${i===st.sel?" sel":""}" data-r="${i}">${f(r.n)}</div>${inp("hi",r.hi)}`});
  $("ans").innerHTML=h+"</div>";
}
function selRow(i){
  const t=st.t;if(!t||t.type!=="rep"||i===st.sel)return;
  st.sel=i;$("nl").innerHTML=svgRep(t.rows[i],t.pet,st.ex);
  document.querySelectorAll("#ans .rn,#ans .zahl").forEach(e=>e.classList.toggle("sel",+e.dataset.r===i));
  if(st.ex)msg(explainRep(t.rows[i]));
}
const KEYS={Z:["z0","z1"],H:["h0","h1"],M:["h0","z0","z1","h1"]};
function buildTab(t){
  const ks=KEYS[t.cols],v=st.ex;
  const hd={h0:["NHT","kleiner","h"],z0:["NZT","kleiner","z"],z1:["NZT","größer","z"],h1:["NHT","größer","h"]};
  const cols=ks.length===4?["h0","z0","N","z1","h1"]:[ks[0],"N",ks[1]];
  let h=`<div class="tb" style="grid-template-columns:3.4rem repeat(${cols.length},1fr)"><span></span>`+cols.map(k=>k==="N"?'<div class="hd">Zahl</div>':`<div class="hd ${hd[k][2]}">${hd[k][0]}<small>${hd[k][1]}</small></div>`).join("");
  t.nums.forEach((x,i)=>{h+=`<div class="rn" style="background:${PCOL[i]}">${i+1}</div>`+cols.map(k=>k==="N"?`<div class="zahl">${f(x.n)}</div>`:`<input class="num ${hd[k][2]}${v?" ok":""}" id="t${i}${k}" ${INP} aria-label="${hd[k][0]} ${hd[k][1]}, Zahl ${i+1}" ${v?`value="${f(x[k])}" readonly`:""}>`).join("")});
  $("ans").innerHTML=h+"</div>";
}
function done(star,text){
  st.done=true;st.res.push(star);if(star)st.stars++;
  msg(text,"good");["chk","tip","sol"].forEach(b=>$(b).hidden=true);$("nxt").hidden=false;leaves();
}
function wrongFb(text){st.tries++;msg(text,"nope");shake($("ans"));if(st.tries>=2)$("sol").hidden=false}
function chk(){
  if(st.done||st.ex)return;const t=st.t;
  if(t.type==="one"){
    const lo=parse($("lo").value),hi=parse($("hi").value),dl=st.dist?parse($("dlo").value):0,dh=st.dist?parse($("dhi").value):0;
    if(lo===null||hi===null||dl===null||dh===null){msg(st.dist?"Fülle alle Felder aus.":"Trage beide Nachbarn ein.");return}
    const a=lo===t.lo,b=hi===t.hi,x=!st.dist||dl===t.n-t.lo,y=!st.dist||dh===t.hi-t.n;
    $("lo").classList.toggle("bad",!a);$("hi").classList.toggle("bad",!b);
    if(st.dist){$("dlo").classList.toggle("bad",!x);$("dhi").classList.toggle("bad",!y)}
    if(a&&b&&x&&y){["lo","hi","dlo","dhi"].forEach(i=>{const e=$(i);if(e){e.classList.remove("bad");e.classList.add("ok");e.readOnly=true}});
      return done(st.tries===0,"Richtig!")}
    if(a&&b)return wrongFb("Die Nachbarn stimmen. Prüfe, wie weit du vor und zurück rechnest.");
    wrongFb(lo>hi?"Die kleinere Zahl gehört nach links.":a?"Der kleinere Nachbar stimmt. Prüfe den größeren.":b?"Der größere Nachbar stimmt. Prüfe den kleineren.":"Noch nicht. Zwischen welchen Strichen steht die Zahl?");
    return;
  }
  if(t.type==="rep"){
    let ok=true,empty=false;
    t.rows.forEach((r,i)=>["lo","hi"].forEach(k=>{if(parse($("t"+i+k).value)===null)empty=true}));
    if(empty){msg("Fülle zuerst alle Felder aus.");return}
    t.rows.forEach((r,i)=>["lo","hi"].forEach(k=>{const e=$("t"+i+k),good=parse(e.value)===r[k];
      if(good){e.readOnly=true;e.classList.remove("bad");e.classList.add("ok")}else{ok=false;e.classList.add("bad")}}));
    ok?done(st.tries===0,"Richtig!"):wrongFb("Die roten Felder stimmen noch nicht.");
    return;
  }
  let all=true,empty=false;
  t.nums.forEach((x,i)=>KEYS[t.cols].forEach(k=>{const e=$("t"+i+k);if(parse(e.value)===null)empty=true}));
  if(empty){msg("Fülle zuerst alle Felder aus.");return}
  t.nums.forEach((x,i)=>KEYS[t.cols].forEach(k=>{const e=$("t"+i+k),ok=parse(e.value)===x[k];
    if(ok){e.readOnly=true;e.classList.remove("bad");e.classList.add("ok")}else{all=false;e.classList.add("bad")}}));
  all?done(st.tries===0,"Richtig!"):wrongFb("Die roten Felder stimmen noch nicht.");
}
function tip(){
  const t=st.t;
  if(t.type==="rep"){msg("Tipp: NT = Tausender, NH = Hunderter, NZ = Zehner. Vorgänger: eins weniger. Nachfolger: eins mehr.");return}
  if(t.type==="tab"){msg("Tipp: Dicke Striche sind Hunderttausender, dünne sind Zehntausender.");return}
  msg(st.dist?`Tipp: Rechne zurück: ${f(t.n)} − kleinerer Nachbar. Rechne vor: größerer Nachbar − ${f(t.n)}.`:`Tipp: Schau auf die ${t.lvl==="Z"?"Zehntausender":"Hunderttausender"}stelle. Der kleinere Nachbar hat danach nur Nullen.`);
}
function solve(){
  if(st.done)return;const t=st.t;
  if(t.type==="one"){[["lo",t.lo],["hi",t.hi],["dlo",t.n-t.lo],["dhi",t.hi-t.n]].forEach(([i,v])=>{const e=$(i);if(e){e.value=f(v);e.className=e.className.replace(" bad","").replace(" ok","")+" ok";e.readOnly=true}});done(false,`Lösung: ${f(t.lo)} und ${f(t.hi)}`+(st.dist?`, zurück ${f(t.n-t.lo)}, vor ${f(t.hi-t.n)}`:"")+".")}
  else if(t.type==="rep"){t.rows.forEach((r,i)=>["lo","hi"].forEach(k=>{const e=$("t"+i+k);e.value=f(r[k]);e.className=e.className.replace(" bad","")+" ok";e.readOnly=true}));done(false,"Lösung: So sieht die Tabelle aus.")}
  else{t.nums.forEach((x,i)=>KEYS[t.cols].forEach(k=>{const e=$("t"+i+k);e.value=f(x[k]);e.className=e.className.replace(" bad","")+" ok";e.readOnly=true}));done(false,"Lösung: So sieht die Tabelle aus.")}
}
$("chk").onclick=chk;$("tip").onclick=tip;$("sol").onclick=solve;
$("nxt").onclick=()=>{
  if(st.ex){load();return}
  if(st.i<st.n-1){st.i++;load();return}
  const k=Math.round(st.stars/st.n*5);
  $("stars").textContent="★".repeat(k)+"☆".repeat(5-k);
  $("score").textContent=`${st.stars} von ${st.n} Aufgaben hast du gleich beim ersten Versuch richtig gelöst.`;
  show("end");
};
/* Eingaben: Punkte setzen, Enter prüft */
$("ans").addEventListener("focusout",e=>{if(e.target.classList&&e.target.classList.contains("num")&&!e.target.readOnly){const v=parse(e.target.value);if(v!==null)e.target.value=f(v)}});
$("ans").addEventListener("focusin",e=>{const r=e.target.dataset&&e.target.dataset.r;if(r!==undefined)selRow(+r)});
$("ans").addEventListener("click",e=>{const el=e.target.closest&&e.target.closest("[data-r]");if(el)selRow(+el.dataset.r)});
$("ans").addEventListener("input",e=>{if(e.target.classList)e.target.classList.remove("bad")});
$("ans").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();chk()}});
/* Menü */
document.querySelectorAll("#segKind button").forEach(b=>b.onclick=()=>{cfg.kind=b.dataset.k;document.querySelectorAll("#segKind button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
$("ex1").onchange=()=>{cfg.explain=$("ex1").checked};
$("di2").onchange=()=>{cfg.dist=$("di2").checked;if(st.game!=="one")return;st.dist=cfg.dist;
  if(!st.t||st.t.type!=="one")return;
  $("nl").innerHTML=svgOne(st.t,st.ex);
  if(st.done)return;
  buildOne(st.t);if(!st.ex)$("q").innerHTML=taskOne(st.t)};
$("ex2").onchange=()=>{cfg.explain=$("ex2").checked;$("ex1").checked=cfg.explain;st.i=0;st.res=[];st.stars=0;load()};
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>start(b.dataset.g));
$("back").onclick=$("home").onclick=()=>{$("ex1").checked=cfg.explain;show("menu")};
$("again").onclick=()=>start(st.game);
</script>
</body>
</html>
